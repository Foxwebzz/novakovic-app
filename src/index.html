<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="utf-8" />
    <title>Nikola Novaković · Aplikacije po meri za firme</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Pravim web aplikacije po meri koje zamenjuju Excel tabele i ručni rad: kalkulacije, ponude, cenovnici i izveštaji za proizvodne i trgovinske firme."
    />
    <meta name="theme-color" content="#0f2236" />

  <body>
    <app-root></app-root>
    <!-- Netlify Forms: skrivena forma da Netlify pri deployu prepozna polja forme "upit".
         Pravu formu šalje ContactService preko fetch-a. -->
    <form name="upit" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="ime" />
      <input name="firma" />
      <input name="kontakt" />
      <textarea name="poruka"></textarea>
    </form>
  </body>
