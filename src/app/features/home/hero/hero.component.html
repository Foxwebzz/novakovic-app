<section class="hero" aria-labelledby="hero-title">
  <canvas #canvas class="hero__canvas" [class.hero__canvas--ready]="sceneReady()" aria-hidden="true"></canvas>
  <div class="hero__shade" aria-hidden="true"></div>

  <div class="wrap hero__inner">
    <h1 id="hero-title" class="hero__title">Vaša firma je prerasla Excel.</h1>
    <p class="hero__lead">
      Pravim aplikacije po meri koje zamenjuju tabele, ručno prepisivanje i ponude koje se
      sklapaju satima. Napravljene oko toga kako vaša firma zaista radi.
    </p>
    <div class="hero__actions">
      <a class="btn btn--primary" href="#kontakt">Opišite svoj problem</a>
      <a class="btn btn--ghost-dark" href="#primer">Pogledajte primer</a>
    </div>
  </div>
</section>
